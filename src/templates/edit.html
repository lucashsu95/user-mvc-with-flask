<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>編輯用戶</title>
    <style>
        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>編輯用戶</h1>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        姓名: <input type="text" name="name" value="{{ user.name }}" required><br>
        Email: <input type="email" name="email" value="{{ user.email }}" required><br>
        Password: <input type="password" name="password" placeholder="如不修改密碼請留空"><br>
        <input type="submit" value="提交">
    </form>
    <p><a href="{{ url_for('index') }}">返回首頁</a></p>
</body>
</html>
